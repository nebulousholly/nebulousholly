name: Atualizar perfil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar grafico Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Publicar na branch pacman-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar grafico de linguagens
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;
            const repos = await github.paginate(github.rest.repos.listForUser, { username: user, type: 'owner', per_page: 100 });
            const totals = {};
            for (const r of repos) {
              if (r.fork || r.archived) continue;
              const { data } = await github.rest.repos.listLanguages({ owner: user, repo: r.name });
              for (const [lang, bytes] of Object.entries(data)) totals[lang] = (totals[lang] || 0) + bytes;
            }
            const palette = {
              'TypeScript': '#3178c6', 'JavaScript': '#f1e05a', 'Python': '#3572A5', 'HTML': '#e34c26',
              'CSS': '#663399', 'SCSS': '#c6538c', 'Shell': '#89e051', 'PowerShell': '#012456',
              'Java': '#b07219', 'C': '#555555', 'C++': '#f34b7d', 'C#': '#178600', 'Go': '#00ADD8',
              'Rust': '#dea584', 'PHP': '#4F5D95', 'Ruby': '#701516', 'Kotlin': '#A97BFF', 'Dart': '#00B4AB',
              'Vue': '#41b883', 'Dockerfile': '#384d54', 'Jupyter Notebook': '#DA5B0B', 'Batchfile': '#C1F12E'
            };
            const color = (n) => {
              if (palette[n]) return palette[n];
              let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 360;
              return `hsl(${h}, 65%, 55%)`;
            };
            const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const top = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const sum = top.reduce((s, [, v]) => s + v, 0) || 1;
            const W = 320, pad = 25, barW = W - 2 * pad;
            let x = pad, bar = '', legend = '';
            top.forEach(([name, bytes], i) => {
              const w = bytes / sum * barW;
              bar += `<rect x="${x.toFixed(2)}" y="55" width="${w.toFixed(2)}" height="8" fill="${color(name)}"/>`;
              x += w;
              const lx = pad + (i % 2) * 150, ly = 90 + Math.floor(i / 2) * 25;
              legend += `<circle cx="${lx + 5}" cy="${ly - 4}" r="5" fill="${color(name)}"/>` +
                `<text x="${lx + 15}" y="${ly}" class="lang">${esc(name)} ${(bytes / sum * 100).toFixed(2)}%</text>`;
            });
            if (!top.length) legend = `<text x="${pad}" y="90" class="lang">Nenhum codigo publico ainda</text>`;
            const H = 90 + Math.max(1, Math.ceil(top.length / 2)) * 25;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
              <style>
                .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #ff6e96; }
                .lang { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #f8f8f2; }
              </style>
              <rect x="0.5" y="0.5" rx="4.5" width="${W - 1}" height="${H - 1}" fill="#282a36" stroke="#e4e2e2"/>
              <text x="${pad}" y="35" class="title">Most Used Languages</text>
              <clipPath id="bar"><rect x="${pad}" y="55" width="${barW}" height="8" rx="5"/></clipPath>
              <g clip-path="url(#bar)">${bar}</g>
              ${legend}
            </svg>`;
            fs.mkdirSync('dist-languages', { recursive: true });
            fs.writeFileSync('dist-languages/languages.svg', svg);

      - name: Publicar na branch languages-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist-languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
